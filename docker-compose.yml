version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: nombre_creativo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nombre_creativo_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      target: development   # hot-reload via uvicorn --reload
    container_name: nombre_creativo_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Override DATABASE_URL to point to the 'db' service container
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/nombre_creativo_db
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount source for live-reload in dev (comment out for production)
      - ./backend:/app

  # ── SvelteKit Frontend ───────────────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: nombre_creativo_frontend
    working_dir: /app
    restart: unless-stopped
    environment:
      # URL pública del backend (accesible desde el navegador)
      PUBLIC_API_BASE_URL: http://localhost:8001/api/v1
    ports:
      - "5173:5173"
    volumes:
      # Monta el código fuente para hot-reload
      - ./frontend:/app
      # Evita sobrescribir node_modules del contenedor con los del host
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data:

