version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: nombre_creativo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nombre_creativo_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      target: development   # hot-reload via uvicorn --reload
    container_name: nombre_creativo_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Override DATABASE_URL to point to the 'db' service container
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/nombre_creativo_db
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount source for live-reload in dev (comment out for production)
      - ./backend:/app

volumes:
  postgres_data:
